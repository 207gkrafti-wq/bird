<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>
<body>
    <div class="place" id="place">
        <div id="menu" class="menu">
        <div class="gameStop" id="gameStop">
            <button id="start" class="start">▶</button>
        </div>
        <div class="gamePlay" id="gamePlay">
            <div class="score" id="score">Счет: 0</div>
            <div>
                <button id="reset" class="reset">↻</button>
                <button id="play" class="play">▶</button>
            </div>
        </div>
    </div>
    <button id="pause" class="pause">■</button>
        <div class="score" id="score">Счет: 0</div>
        <div class="bird--place">
            <div class="bird" id="bird"></div>
        </div>
        <div class="barrier" id="barrier">
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
